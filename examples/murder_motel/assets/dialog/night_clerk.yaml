# Night Clerk dialog — the SPEC §13 acceptance fixture's branching
# conversation (Task 13d). The third top-level choice is gated on
# `heard_rumor`, which the player can only set by first asking about
# the murder. Re-engaging the clerk after asking the rumor unlocks
# the master-key request, demonstrating flag-driven branching.

start: greeting
nodes:
  greeting:
    lines:
      - "The Night Clerk slouches behind the counter, half-asleep."
      - "'Yeah? Whaddya want?'"
    choices:
      - text: "Just checking in."
        goto: checkin
      - text: "I heard about the murder."
        set: [heard_rumor]
        goto: rumor
      - text: "Got a master key I can borrow?"
        requires: heard_rumor
        set: [has_key]
        goto: key_handed_over
      - text: "Never mind."
        goto: end

  checkin:
    lines:
      - "'Room 7 is open. Don't ask why.'"
    set: [has_room_assigned]
    goto: end

  rumor:
    lines:
      - "He goes white. 'Yeah. Real bad business in Room 4.'"
      - "'Don't go pokin' around without protection.'"
    choices:
      - text: "What about that key?"
        set: [has_key]
        goto: key_handed_over
      - text: "Thanks. I'll be careful."
        goto: end

  key_handed_over:
    lines:
      - "He hesitates, then slides a brass key across the counter."
      - "'Don't lose it. And don't say I gave it to ya.'"
    goto: end

  end: {}
