#
# `foglet_game` — the library crate authors depend on to build a
# Foglet-compatible terminal door game.
#

[package]
name        = "foglet_game"
description = "Authoring kit for Foglet external_pty terminal door games."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
readme       = "README.md"
keywords     = ["foglet", "bbs", "tui", "gamedev", "ratatui"]

[lib]
# Explicit so future binaries in `examples/` or `crates/fgk` can link
# against this crate by its declared name.
name = "foglet_game"
path = "src/lib.rs"

[features]
# Test-only harness APIs for local multi-user/shared-world scenarios.
# Not enabled by default so release game binaries do not compile the
# harness module.
test-support = []

[dependencies]
# Typed `FogletContext` struct, JSON context loader, and
# library-internal error variants.
serde      = { workspace = true }
serde_json = { workspace = true }
# Dialog scripts are structured YAML (content), while saves and
# manifests use JSON, and config uses TOML. Pulled in at the library
# boundary so games depend on it transitively.
serde_yaml = { workspace = true }
# Game config parser reads `assets/game.toml` into a typed
# `GameConfig`. Workspace-pinned so all crates stay in lockstep.
toml       = { workspace = true }
thiserror  = { workspace = true }
# Terminal guard drives raw mode + alternate-screen toggling through
# `crossterm`. The guard wraps these calls behind a trait so the
# orchestration logic is unit-testable without a real TTY.
crossterm  = { workspace = true }
# `ratatui::Frame` is part of the `Screen::render` public API — every
# game crate transitively depends on this anyway.
ratatui    = { workspace = true }
# Atomic save: `NamedTempFile::new_in` writes to the same directory as
# `save.json` so the final `rename(2)` is atomic on POSIX.
tempfile   = { workspace = true }
# World DB: rusqlite with bundled SQLite. The `bundled` feature vendors
# the SQLite C amalgamation so operators do not need a system
# libsqlite3 to run a packaged Foglet door.
rusqlite   = { workspace = true }

[dev-dependencies]
# (Tests reuse `tempfile` from `[dependencies]` above — no extra entry
# needed. The context-loader tests write a context file to a real path
# on disk via the same crate.)
#
# `anyhow` lets the `murder_motel` example present `fn main() ->
# anyhow::Result<()>` the way author code is meant to. Library code
# stays on `thiserror`-derived errors.
anyhow = { workspace = true }
# `rstest` parameterized tests for state-machine transition tables:
# one test per (from-state, helper) pair so a relaxed gate flunks at
# `cargo test` rather than in production.
rstest = { workspace = true }

# --- Workspace fixture ------------------------------------------------
#
# `murder_motel` is a repository fixture and sample game kept outside
# the published crate payload. It remains registered here so local
# contributors can run `cargo run --example murder_motel` from a repo
# checkout while crates.io users only receive the library itself.
[[example]]
name = "murder_motel"
path = "../../examples/murder_motel/src/main.rs"
