#
# `foglet_game` — the library crate authors depend on to build a
# Foglet-compatible terminal door game. SPEC §6 lists the module
# layout this crate will eventually grow into; for Task 1 we only
# stand up the crate so `cargo check --workspace` and
# `cargo test --workspace` are green. Real modules land in their own
# tasks (terminal guard in Task 5, runtime in Task 7, etc.).
#

[package]
name        = "foglet_game"
description = "Authoring kit for Foglet external_pty terminal door games."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }

[lib]
# Explicit so future binaries in `examples/` or `crates/fgk` can link
# against this crate by its declared name.
name = "foglet_game"
path = "src/lib.rs"

[dependencies]
# Task 2 (Foglet context loader) pulls in serde for the typed
# `FogletContext` struct, serde_json to parse the
# `FOGLET_DOOR_CONTEXT` file, and thiserror for library-internal
# error variants (per SPEC §6 + the "thiserror inside libraries"
# rule in PROMPT.md).
serde      = { workspace = true }
serde_json = { workspace = true }
# Task 9b (dialog state machine) reads dialog scripts as structured
# YAML. The format choice is locked in `DECISIONS.md` (ADR
# 2026-05-08): YAML for content, JSON for saves and manifests, TOML
# for config + tile legends. Pulled in at the library boundary so
# games depend on it transitively rather than re-adding it themselves.
serde_yaml = { workspace = true }
# Task 4 (game config parser) reads `assets/game.toml` into a typed
# `GameConfig`. Sourced from the workspace-pinned crate budget so any
# other crate parsing TOML in the tree stays in lockstep.
toml       = { workspace = true }
thiserror  = { workspace = true }
# Task 5 (terminal guard) drives raw mode + alternate-screen toggling
# through `crossterm`. The guard wraps these calls behind a trait so
# the orchestration logic (Drop ordering, cleaned-flag, panic hook in
# 5c) is unit-testable without a real TTY, but the production backend
# delegates straight to `crossterm::terminal` per SPEC §6.
crossterm  = { workspace = true }
# Task 7 (screen stack + runtime loop) needs `ratatui::Frame` so the
# `Screen::render` signature in SPEC §8.2 compiles. Pulled in at the
# library boundary because the trait is part of the public authoring
# API — every game crate transitively depends on this anyway.
ratatui    = { workspace = true }
# Task 8b (atomic save manager) uses `tempfile::NamedTempFile::new_in`
# to write the JSON sidecar in the *same* directory as the target
# `save.json` and then `persist()` it. Co-locating the temp file is
# what makes the final `rename(2)` atomic on POSIX (same filesystem)
# and what the SPEC §10.4 wrapper, the architecture tenets in
# PROMPT.md, and SPEC §13's reliability bar all require.
tempfile   = { workspace = true }
# `serde_json` from the workspace pin lets the save manager serialize
# arbitrary author-defined save state to JSON via `serde_json::to_writer`
# / `from_reader`. Already declared above for the context loader.
#
# SPEC_v2 §Task 3 (world DB open/bootstrap) — rusqlite with bundled
# SQLite. See DECISIONS.md ADR 2026-05-08. The `bundled` feature vendors
# the SQLite C amalgamation so operators do not need a system
# libsqlite3 to run a packaged Foglet door.
rusqlite   = { workspace = true }

[dev-dependencies]
# (Tests reuse `tempfile` from `[dependencies]` above — no extra entry
# needed. The context-loader tests write a context file to a real path
# on disk via the same crate.)
#
# `anyhow` is pulled in only so the `murder_motel` example (Task 13)
# can present a single Foglet door binary the way author code is meant
# to: `fn main() -> anyhow::Result<()>` matching the scaffold template
# from SPEC §10.1. Library code stays on `thiserror`-derived errors per
# the architecture tenets.
anyhow = { workspace = true }

# --- Examples ---------------------------------------------------------
#
# `murder_motel` is the SPEC §13 acceptance fixture: a small but
# complete door game exercised by `cargo run --example murder_motel`.
# Its sources live at the workspace root (`examples/murder_motel/`)
# rather than under `crates/foglet_game/examples/` so the project also
# reads as a self-contained scaffold an author can copy. Cargo accepts
# example paths outside the package directory — the only constraint is
# that the file lives somewhere on disk relative to this manifest.
[[example]]
name = "murder_motel"
path = "../../examples/murder_motel/src/main.rs"
