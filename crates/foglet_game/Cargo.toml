#
# `foglet_game` — the library crate authors depend on to build a
# Foglet-compatible terminal door game. SPEC §6 lists the module
# layout this crate will eventually grow into; for Task 1 we only
# stand up the crate so `cargo check --workspace` and
# `cargo test --workspace` are green. Real modules land in their own
# tasks (terminal guard in Task 5, runtime in Task 7, etc.).
#

[package]
name        = "foglet_game"
description = "Authoring kit for Foglet external_pty terminal door games."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }

[lib]
# Explicit so future binaries in `examples/` or `crates/fgk` can link
# against this crate by its declared name.
name = "foglet_game"
path = "src/lib.rs"

[dependencies]
# Task 2 (Foglet context loader) pulls in serde for the typed
# `FogletContext` struct, serde_json to parse the
# `FOGLET_DOOR_CONTEXT` file, and thiserror for library-internal
# error variants (per SPEC §6 + the "thiserror inside libraries"
# rule in PROMPT.md).
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
# `tempfile` lets the loader tests write a context file to a real
# path on disk, exercising the same code path Foglet uses in prod
# (env var → filesystem → parse) instead of stubbing the filesystem.
tempfile = { workspace = true }
