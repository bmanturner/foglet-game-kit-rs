#
# `fgk` — the operator-facing CLI for foglet-game-kit-rs.
#
# Eventual subcommands (per SPEC §15):
#   - `fgk new <path>`            scaffold a starter game project
#   - `fgk emit-manifest`         print Foglet manifest JSON
#   - `fgk package`               produce a deployable door bundle
#
# The crate ships as both a library and a binary: the library exposes
# template fixtures and (later) manifest/package helpers so unit tests
# can exercise them without driving the binary, while `main.rs` stays
# the thin operator-facing entry point.
#

[package]
name        = "fgk"
description = "CLI for scaffolding and packaging Foglet door games."
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }

[lib]
# Explicit lib name so `use fgk::...` works in both unit tests and
# (eventually) the binary.
name = "fgk"
path = "src/lib.rs"

[[bin]]
# Explicit binary name so `cargo run -p fgk -- ...` works without
# needing to remember the package-name → binary mapping.
name = "fgk"
path = "src/main.rs"

[dependencies]
# Library crate: every CLI subcommand will eventually reach into
# `foglet_game` (manifest emission, config parsing, etc.).
foglet_game = { path = "../foglet_game" }

# Argument parsing for the `fgk` subcommands. `derive` keeps the
# subcommand definitions colocated with the structs they populate.
# Introduced by Task 10b (`fgk new`); future subcommands extend the
# same enum.
clap = { workspace = true }

# Process-boundary error chain for the binary. Library-internal
# scaffolding errors are `thiserror`-based and convert into
# `anyhow::Error` via `?` at the CLI boundary.
anyhow = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
# Round-trip the embedded `Cargo.toml` template through a real TOML
# parser as part of the template fixture tests (Task 10a).
toml = { workspace = true }

# Scratch directories for scaffolder tests (Task 10b). The scaffolder
# writes real files; `tempfile::TempDir` keeps each test hermetic.
tempfile = { workspace = true }

# Drives the `fgk` binary as an end-to-end smoke test (Task 10b).
assert_cmd = { workspace = true }
predicates = { workspace = true }

# Parse the JSON `fgk emit-manifest` prints to stdout in the Task 11
# CLI smoke test, so the assertion is on values rather than brittle
# substring matches.
serde_json = { workspace = true }

# Syntactic validation of the embedded `src/main.rs` template — see
# DECISIONS.md ADR 2026-05-08 (template fixture validation) for why
# `syn` joins the crate budget. `default-features = false` keeps the
# dev-dep surface small: we only need the parser, not codegen.
syn = { version = "2", features = ["full"] }
