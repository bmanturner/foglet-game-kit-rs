#
# Workspace root for foglet-game-kit-rs.
#
# Why a workspace? SPEC §6 splits the project into a reusable library
# crate (`foglet_game`) and an operator-facing CLI (`fgk`). Keeping them
# in a Cargo workspace lets them share a single dependency resolution
# pass, identical lints/edition settings, and one `cargo test`
# invocation for CI.
#
# The [workspace.dependencies] table is the single source of truth for
# every crate version pulled in by either member crate. Member crates
# enable specific dependencies via `dep = { workspace = true }` so that
# bumping a version (or auditing the dependency surface against
# SPEC §6) only ever touches this file.
#

[workspace]
resolver = "2"
members = ["crates/foglet_game", "crates/fgk"]

[workspace.package]
# Pinned at the project's first published edition so member crates can
# inherit consistently. Bump deliberately, never opportunistically.
edition     = "2021"
rust-version = "1.80"
version     = "0.1.0"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/foglet/foglet-game-kit-rs"
authors     = ["foglet-game-kit-rs contributors"]

[workspace.dependencies]
# --- Approved crate budget (SPEC §6 + DECISIONS.md). ----------------
# Adding anything not listed here requires an ADR in DECISIONS.md.

# Terminal UI
ratatui   = "0.30"
crossterm = "0.28"

# Serde + content formats
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
serde_yaml = "0.9" # see DECISIONS.md ADR 2026-05-08

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
anyhow    = "1"
thiserror = "2"

# Logging — never to stdout while a TUI owns the terminal (SPEC §13).
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
tracing-appender    = "0.2"

# Filesystem helpers
tempfile = "3"

# Shared-world persistence (SPEC_v2 §Task 1; see DECISIONS.md ADR
# 2026-05-08 — rusqlite with bundled SQLite). The `bundled` feature
# vendors the SQLite C amalgamation so operators do not need a system
# libsqlite3 to run a packaged Foglet door.
rusqlite = { version = "0.39", features = ["bundled"] }

# Test-only helpers (pulled in by individual member crates' [dev-dependencies]).
assert_cmd = "2"
predicates = "3"
rstest     = "0.23"
insta      = { version = "1", features = ["json", "yaml"] }

[profile.release]
# Modest size + speed defaults for a binary that ships inside Foglet
# door installs. LTO and a stripped binary reduce on-disk footprint;
# `panic = "abort"` is intentionally NOT set because the terminal
# guard's panic-hook contract (SPEC §13.1) relies on unwinding to run
# the restoration sequence before the process dies.
lto          = "thin"
codegen-units = 1
strip         = "symbols"
