[workspace]
resolver = "2"
members = ["crates/foglet_game", "crates/fgk"]

[workspace.package]
# Pinned at the project's first published edition so member crates can
# inherit consistently. Bump deliberately, never opportunistically.
edition     = "2021"
rust-version = "1.80"
version     = "0.1.0"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/bmanturner/foglet-game-kit-rs"
authors     = ["foglet-game-kit-rs contributors"]

[workspace.dependencies]

# Terminal UI
ratatui   = "0.30"
crossterm = "0.28"

# Serde + content formats
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
serde_yaml = "0.9" # see DECISIONS.md ADR 2026-05-08

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
anyhow    = "1"
thiserror = "2"

# Logging — never to stdout while a TUI owns the terminal (SPEC §13).
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
tracing-appender    = "0.2"

# Filesystem helpers
tempfile = "3"

rusqlite = { version = "0.39", features = ["bundled"] }

# Test-only helpers (pulled in by individual member crates' [dev-dependencies]).
assert_cmd = "2"
predicates = "3"
rstest     = "0.23"
insta      = { version = "1", features = ["json", "yaml"] }

[profile.release]
lto          = "thin"
codegen-units = 1
strip         = "symbols"
